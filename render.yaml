# ============================================
# SalesMate — Render Blueprint
#
# Dán repo này vào Render → New → Blueprint. Render đọc file này và tạo service
# một lượt, khỏi bấm tay từng cái.
#
#   salesmate-api-dev    API sản phẩm, nhánh develop
#   salesmate-ai-core    lõi AI, nhánh develop
#
# HIỆN TẠI CHỈ DEPLOY NHÁNH develop.
# Nhánh main đang là bản 05/08, chưa có thư mục interface/ — trỏ service vào đó
# là build hỏng ngay. Khi nào merge develop -> main xong thì thêm môi trường
# production: copy khối salesmate-api-dev, đổi tên thành salesmate-api, đổi
# `branch: develop` thành `branch: main`. Xem DEPLOY.md.
#
# Lõi AI chỉ có một bản vì nó không giữ trạng thái (RAG đang tắt, lịch sử chat
# do API gửi kèm mỗi request). Bớt một service là bớt một lần chờ cold start.
#
# Biến `sync: false` = Render KHÔNG lấy từ file này, bạn tự dán trong dashboard.
# Secret không bao giờ nằm trong git.
# ============================================

services:
  # ---- API sản phẩm — development (team) ----
  - type: web
    name: salesmate-api-dev
    runtime: python
    plan: free
    region: singapore
    branch: develop
    rootDir: interface/backend
    # requirements.txt thôi, KHÔNG cài requirements-dev.txt — server không cần
    # pytest và ruff. Đây là lý do hai file đó tách nhau.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Một Supabase project dùng chung cho mọi môi trường — quyết định của
      # team. Hệ quả: sửa dữ liệu ở đây là người dùng thấy ngay. Xem DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: apartment-images
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        sync: false
      - key: AI_CORE_URL
        sync: false
      - key: AI_CORE_TIMEOUT
        value: "60"

  # ---- Lõi AI ----
  # Cũng theo develop. Để branch main thì nó chạy src/ của bản 05/08, lệch 13
  # file so với develop — API mới nói chuyện với lõi AI cũ, sai lệch rất khó lần.
  - type: web
    name: salesmate-ai-core
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Dockerfile ghim cứng --port 8000; Render cấp cổng qua $PORT nên phải ghi đè.
    dockerCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Bỏ trống cũng chạy: bootstrap.py rơi về ScriptedProvider, chat trả lời
      # theo kịch bản sẵn thay vì gọi model thật. Nhưng RAG thì hỏng câm: thiếu
      # key là rơi về FakeEmbedder, vector giả không khớp gì với dữ liệu đã nhúng
      # bằng model thật, nên truy hồi luôn rỗng mà KHÔNG báo lỗi.
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL_FAST
        value: gpt-4o-mini
      - key: LLM_MODEL_ANSWER
        value: gpt-4o-mini
      - key: LOG_LEVEL
        value: INFO

      # ---- Vector store cho RAG ----
      # Thiếu ba biến này thì qdrant_url rơi về http://localhost:6333, trong
      # container không có Qdrant nào ⇒ mọi câu hỏi cần tài liệu trả 502
      # "Truy vấn Qdrant thất bại".
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documents_chunks

      # ---- Postgres cho tool tồn kho ----
      # Tool inventory_lookup đọc bảng inventory_units để trả giá và tình trạng
      # căn theo thời gian thực. Thiếu biến này thì database_url rơi về
      # sqlite:///./data/app.db — một file rỗng trong container, tool không tìm
      # thấy căn nào và trợ lý trả lời "chưa đủ dữ liệu".
      - key: DATABASE_URL
        sync: false
