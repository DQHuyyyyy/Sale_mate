# ============================================
# SalesMate — hạ tầng local
#
#   docker compose up -d              chạy cả stack
#   docker compose up -d qdrant db    chỉ chạy hạ tầng, app chạy bằng uvicorn
#   docker compose logs -f ai-core    xem log
#
# Ba tầng sau khi gộp nhánh dat:
#   frontend/  Vite + React   :5173  proxy /api -> :8000
#   backend/   API sản phẩm   :8000  auth · apartments · zones · sales · chat
#   src/       lõi AI + RAG   :8001  backend/ gọi vào qua AI_CORE_URL
#   docker compose down               dừng (giữ dữ liệu)
#   docker compose down -v            dừng và XOÁ dữ liệu
# ============================================

services:
  # Lõi AI: agent graph + RAG. backend/ gọi vào đây qua AI_CORE_URL.
  # Cổng 8000 vẫn là cổng trong container; ra ngoài đổi sang 8001 để nhường
  # 8000 cho API sản phẩm ở backend/ (frontend proxy /api thẳng vào đó).
  ai-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesmate-ai-core
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://salesmate:salesmate@db:5432/salesmate
    depends_on:
      qdrant:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Vector store — payload filtering để lọc phân quyền ngay tại truy vấn (ADR-001)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: salesmate-qdrant
    ports:
      - "6333:6333" # REST + dashboard: http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Dữ liệu có cấu trúc: user, giá, tài liệu/version, lịch sử chat, log
  db:
    image: postgres:16-alpine
    container_name: salesmate-db
    environment:
      POSTGRES_USER: salesmate
      POSTGRES_PASSWORD: salesmate
      POSTGRES_DB: salesmate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesmate -d salesmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant-data:
  postgres-data:
