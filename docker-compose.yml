# ============================================
# SalesMate — hạ tầng local
#
#   docker compose up -d              chạy cả stack
#   docker compose up -d qdrant db    chỉ chạy hạ tầng, backend chạy bằng uvicorn
#   docker compose logs -f backend    xem log
#   docker compose down               dừng (giữ dữ liệu)
#   docker compose down -v            dừng và XOÁ dữ liệu
# ============================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesmate-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://salesmate:salesmate@db:5432/salesmate
    depends_on:
      qdrant:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Vector store — payload filtering để lọc phân quyền ngay tại truy vấn (ADR-001)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: salesmate-qdrant
    ports:
      - "6333:6333" # REST + dashboard: http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Dữ liệu có cấu trúc: user, giá, tài liệu/version, lịch sử chat, log
  db:
    image: postgres:16-alpine
    container_name: salesmate-db
    environment:
      POSTGRES_USER: salesmate
      POSTGRES_PASSWORD: salesmate
      POSTGRES_DB: salesmate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesmate -d salesmate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant-data:
  postgres-data:
