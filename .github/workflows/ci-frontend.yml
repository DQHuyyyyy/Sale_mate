name: CI Frontend

# Chỉ chạy khi PR thực sự đụng tới interface/frontend/. Phần lớn PR backend
# không cần job này — bỏ qua được là tiết kiệm khoảng một nửa Actions minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    paths:
      - "interface/frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — build
    # Runner của BTC, dùng chung cho mọi team. Xem chú thích ở ci-ai-core.yml.
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: interface/frontend/package-lock.json

      - name: Install dependencies
        working-directory: interface/frontend
        run: npm ci

      # Chưa có bước lint: frontend Vite hiện không cấu hình ESLint (package.json
      # không có script `lint`, đã bỏ eslint.config.mjs khi chuyển từ Next.js).
      # Thêm ESLint lại là việc riêng, đừng để CI đỏ vì thiếu script.
      - name: Build
        working-directory: interface/frontend
        run: npm run build
