name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Mỗi người làm trên nhánh riêng và push nhiều lần trong ngày. Huỷ run cũ khi
# có commit mới trên cùng PR để không đốt Actions minutes vào kết quả đã lỗi thời.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
